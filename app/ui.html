<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRT Scanner</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
  --accent: #2f6fdb; --accent-text: #ffffff; --del: #fbe3e1; --del-text: #9c2a1f;
  --ins: #dff3e3; --ins-text: #1d6b33; --warn: #fff4d6; --warn-line: #e8c76a; --chip: #efeee9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9b9a93; --line: #34332f;
    --accent: #6b9bf0; --accent-text: #0e1420; --del: #4a2420; --del-text: #f4b3aa;
    --ins: #1d3b26; --ins-text: #a6e0b5; --warn: #3a3220; --warn-line: #8c7537; --chip: #2a2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 120px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 18px; margin: 0; }
h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 0 8px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
#drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; cursor: pointer; }
#drop.over { border-color: var(--accent); }
#drop strong { display: block; font-size: 16px; margin-bottom: 4px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 7px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
button.small { padding: 2px 8px; font-size: 13px; }
.muted { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 7px 8px; border-top: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 12px; border-top: none; }
td.cb { width: 28px; }
td.num { white-space: nowrap; width: 60px; }
td.ts { white-space: nowrap; width: 80px; color: var(--muted); }
td.txt { width: 32%; word-break: break-word; }
td.why { color: var(--muted); }
td.fix.editable { cursor: text; }
td.fix.editable:hover { outline: 1px dashed var(--line); outline-offset: -3px; border-radius: 4px; }
.mine { display: inline-block; font-size: 11px; font-weight: 600; background: var(--accent); color: var(--accent-text);
  border-radius: 4px; padding: 0 5px; margin-right: 2px; }
tr.off td:not(.cb) { opacity: .45; }
del { background: var(--del); color: var(--del-text); text-decoration: none; border-radius: 3px; padding: 0 1px; }
ins { background: var(--ins); color: var(--ins-text); text-decoration: none; border-radius: 3px; padding: 0 1px; }
.sep { color: var(--muted); padding: 0 4px; }
textarea { width: 100%; font: 14px/1.4 ui-monospace, Consolas, monospace; background: var(--bg); color: var(--text);
  border: 1px solid var(--accent); border-radius: 6px; padding: 6px; }
.note { background: var(--warn); border: 1px solid var(--warn-line); border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
.group-head { cursor: pointer; }
.group-head td { font-weight: 600; }
.group-items { display: none; }
.group-items.open { display: table-row-group; }
.file-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding: 12px 16px; display: none; }
.bar .inner { max-width: 1180px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.err { color: var(--del-text); }
.actions { white-space: nowrap; }
a { color: var(--accent); }
code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-all; }
pre { white-space: pre-wrap; word-break: break-word; }
@media (max-width: 720px) {
  td.ts, th.ts { display: none; }
  td.txt { width: auto; }
}
</style>
</head>
<body>
<main>
  <h1>SRT Scanner</h1>
  <p class="sub">Checks OCR'd English subtitles and fixes only what you approve. Runs on this computer; nothing is uploaded anywhere.</p>

  <section class="panel" id="start">
    <div id="drop">
      <strong>Drop .srt files (or a .zip of them) here</strong>
      <span class="muted">or click to choose files</span>
      <input type="file" id="pick" multiple accept=".srt,.zip" hidden>
    </div>
    <div class="chips" id="queued" style="margin-top:12px"></div>
    <div class="row">
      <button class="primary" id="go" disabled>Check files</button>
      <label><input type="checkbox" id="recheck"> Re-check files already finished</label>
      <span id="status" class="muted"></span>
    </div>
  </section>

  <div id="extras"></div>
  <div id="results"></div>
  <div id="done"></div>
</main>

<div class="bar" id="bar">
  <div class="inner">
    <span id="count"></span>
    <span>
      <button id="none">Select none</button>
      <button id="defaults">Reset selection</button>
      <button class="primary" id="apply">Apply selected fixes</button>
    </span>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let queue = [], run = null, data = null;
const picked = new Set(), edits = {};

// The page talks to a backend: the local Python server (below), or the in-browser engine that the
// GitHub Pages build defines as window.srtBackend before this script runs (web/web.js).
async function api(path, body, raw) {
  const r = await fetch(path, {method: "POST", body: raw ? body : JSON.stringify(body || {}),
    headers: raw ? {"Content-Type": "application/octet-stream"} : {"Content-Type": "application/json"}});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const localServer = {
  kind: "local",
  ready: Promise.resolve(),
  newRun: async () => (await api("/api/run")).run,
  upload: (run, name, buf) => api(`/api/upload?run=${encodeURIComponent(run)}&name=${encodeURIComponent(name)}`, buf, true),
  check: (run, recheck) => api("/api/check", {run, recheck}),
  apply: (run, picked, edits) => api("/api/apply", {run, picked, edits}),
  acceptWord: word => api("/api/accept-word", {word}),
  downloadUrl: async (run, file) => `/api/download?run=${encodeURIComponent(run)}&file=${encodeURIComponent(file)}`,
};
const backend = window.srtBackend || localServer;

// ---------- choosing files ----------
const drop = $("#drop"), pick = $("#pick");
drop.onclick = () => pick.click();
pick.onchange = () => addFiles(pick.files);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); };
function addFiles(list) {
  for (const f of list) {
    if (!/\.(srt|zip)$/i.test(f.name)) continue;
    if (!queue.some(q => q.name === f.name && q.size === f.size)) queue.push(f);
  }
  $("#queued").innerHTML = queue.map(f => `<span class="chip">${esc(f.name)}</span>`).join("");
  $("#go").disabled = !queue.length;
}

$("#go").onclick = async () => {
  $("#go").disabled = true;
  $("#done").innerHTML = "";
  const st = $("#status");
  try {
    st.textContent = "Loading the checker...";
    await backend.ready;
    st.textContent = "Reading files...";
    run = await backend.newRun();
    for (const f of queue) await backend.upload(run, f.name, await f.arrayBuffer());
    st.textContent = `Checking ${queue.length} file${queue.length === 1 ? "" : "s"} (a few seconds each)...`;
    await new Promise(r => setTimeout(r, 30));  // let the status paint before a long check
    data = await backend.check(run, $("#recheck").checked);
    st.textContent = "";
    render();
  } catch (e) {
    st.innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
  $("#go").disabled = !queue.length;
};

// ---------- word diff ----------
function diff(a, b) {
  if (!b || a === b) return [esc(a), esc(b)];
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/), n = A.length, m = B.length;
  if (n * m > 40000) return [esc(a), esc(b)];
  const L = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, x = "", y = "";
  while (i < n || j < m) {
    if (i < n && j < m && A[i] === B[j]) { x += esc(A[i]); y += esc(B[j]); i++; j++; }
    else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { y += /^\s+$/.test(B[j]) ? esc(B[j]) : `<ins>${esc(B[j])}</ins>`; j++; }
    else { x += /^\s+$/.test(A[i]) ? esc(A[i]) : `<del>${esc(A[i])}</del>`; i++; }
  }
  return [x, y];
}
const slashes = s => s.replace(/ \/ /g, '<span class="sep">/</span>');

// ---------- report ----------
function defaults() {
  picked.clear();
  for (const f of data.files) for (const r of f.rows) if (r.bucket !== "call" && r.has_fix) picked.add(r.key);
  for (const k in edits) delete edits[k];
}

function render() {
  defaults();
  const res = $("#results");
  if (!data.files.length) {
    res.innerHTML = `<section class="panel">${esc(data.summary)}<p class="muted">Tick "Re-check files already finished" to check them again.</p></section>`;
    $("#bar").style.display = "none";
    return;
  }
  let html = "";
  if (data.skipped) html += `<div class="note">${data.skipped} file(s) skipped: already finished and unchanged since. Tick "Re-check files already finished" to include them.</div>`;
  html += `<p class="muted">Untick anything you don't want. To write your own fix, click a suggested fix (or Edit).</p>`;
  for (const f of data.files) html += fileHtml(f);
  res.innerHTML = html;
  $("#bar").style.display = "block";
  wire();
  sync();
}

function fileHtml(f) {
  if (f.error) return `<section class="panel"><h2>${f.n}. ${esc(f.name)}</h2><p class="err">Could not be read: ${esc(f.error)}</p></section>`;
  const calls = f.rows.filter(r => r.bucket === "call");
  const fixes = f.rows.filter(r => r.bucket === "fix");
  const fmt = f.rows.filter(r => r.bucket === "format");
  let h = `<section class="panel" data-file="${f.n}"><div class="file-head"><h2>${f.n}. ${esc(f.name)}</h2>
    <span class="muted">${f.cue_count ?? "?"} cues · ${fixes.length + fmt.length} corrections · ${calls.length} need your call</span></div>`;
  if (!f.rows.length) h += `<p>No issues found.</p>`;
  if (f.names.length) {
    h += `<div class="note"><b>Names to double-check.</b> These look like one name spelled two ways (or two different people):<br>` +
      f.names.map(p => p.names.map(n => `<b>${esc(n)}</b> (lines ${p.cues[n].slice(0, 8).join(", ")}${p.cues[n].length > 8 ? "…" : ""})`).join(" vs ")).join("<br>") +
      `<br><span class="muted">Fix the odd one out with Edit on its line below if it has a row, or in Subtitle Edit.</span></div>`;
  }
  if (calls.length) {
    h += `<h3>Needs your call</h3><p class="muted" style="margin:0 0 6px">Not applied unless you tick them.</p>` + table(calls);
  }
  if (fixes.length) h += `<h3>Corrections</h3>` + table(fixes);
  if (fmt.length) {
    h += `<h3>Formatting (house style)</h3><table><thead><tr><th></th><th>Line #</th><th class="ts">Time</th><th>Error</th><th>Fix</th><th>Type</th><th></th></tr></thead>`;
    const groups = {};
    for (const r of fmt) (groups[r.group] ??= []).push(r);
    let g = 0;
    for (const [name, rs] of Object.entries(groups)) {
      g++;
      const id = `g${f.n}-${g}`;
      if (rs.length === 1 && name === "File format") { h += `<tbody>${rowHtml(rs[0])}</tbody>`; continue; }
      h += `<tbody><tr class="group-head" data-group="${id}"><td class="cb"><input type="checkbox" class="gcb" data-group="${id}"></td>
        <td colspan="6">${esc(name)} <span class="muted">· ${rs.length} line${rs.length > 1 ? "s" : ""} · click to show</span></td></tr></tbody>
        <tbody class="group-items" id="${id}">${rs.map(r => rowHtml(r, id)).join("")}</tbody>`;
    }
    h += `</table>`;
  }
  return h + `</section>`;
}

function table(rows) {
  return `<table><thead><tr><th></th><th>Line #</th><th class="ts">Time</th><th>Text</th><th>Fix</th><th>Why</th><th></th></tr></thead>
    <tbody>${rows.map(r => rowHtml(r)).join("")}</tbody></table>`;
}

const canEdit = r => !!(r.line_nos && r.line_nos.length);

function rowHtml(r, group) {
  const [a, b] = r.suggested && r.suggested !== "Delete this cue" ? diff(r.current || "", r.suggested) : [esc(r.current), esc(r.suggested || "–")];
  const accept = (r.unknown || []).map(w => `<button class="small accept" data-word="${esc(w)}">Accept “${esc(w)}”</button>`).join(" ");
  return `<tr data-key="${esc(r.key)}"${group ? ` data-in="${group}"` : ""}>
    <td class="cb"><input type="checkbox" class="icb" data-key="${esc(r.key)}"${r.has_fix ? "" : " disabled"}></td>
    <td class="num">${r.cue ?? "–"}</td><td class="ts">${esc((r.ts || "").split(",")[0]) || "–"}</td>
    <td class="txt">${slashes(a)}</td><td class="txt fix${canEdit(r) ? " editable" : ""}"${canEdit(r) ? ' title="Click to write your own fix"' : ""}>${slashes(b)}</td>
    <td class="why">${esc(r.reason)}${accept ? `<div style="margin-top:4px">${accept}</div>` : ""}</td>
    <td class="actions">${canEdit(r) ? `<button class="small edit">Edit</button>` : ""}</td></tr>`;
}

const rowsByKey = () => Object.fromEntries(data.files.flatMap(f => f.rows.map(r => [r.key, r])));

function wire() {
  const byKey = rowsByKey();
  document.querySelectorAll(".icb").forEach(cb => cb.onchange = () => {
    cb.checked ? picked.add(cb.dataset.key) : picked.delete(cb.dataset.key); sync();
  });
  document.querySelectorAll(".gcb").forEach(cb => {
    cb.onclick = e => e.stopPropagation();
    cb.onchange = () => {
      document.querySelectorAll(`tr[data-in="${cb.dataset.group}"]`).forEach(tr =>
        cb.checked ? picked.add(tr.dataset.key) : picked.delete(tr.dataset.key));
      sync();
    };
  });
  document.querySelectorAll(".group-head").forEach(tr => tr.onclick = () => $("#" + tr.dataset.group).classList.toggle("open"));
  document.querySelectorAll("tr[data-key]").forEach(tr => {
    const r = byKey[tr.dataset.key];
    if (!canEdit(r)) return;
    tr.querySelector(".fix").onclick = e => { if (!tr.querySelector("textarea")) openEditor(tr, r); };
    tr.querySelector(".actions").onclick = e => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.classList.contains("edit")) openEditor(tr, r);
      if (b.classList.contains("done")) closeEditor(tr, r);
      if (b.classList.contains("undo")) revertEdit(tr, r);
    };
  });
  document.querySelectorAll(".accept").forEach(btn => btn.onclick = async () => {
    try {
      await backend.acceptWord(btn.dataset.word);
      btn.replaceWith(Object.assign(document.createElement("span"), {className: "muted", textContent: `“${btn.dataset.word}” won't be flagged again.`}));
    } catch (e) { alert(e.message); }
  });
}

// ---------- your own text for a line ----------
// One override per cue: the text replaces the cue's lines as they are in the file, so any other
// suggestion for the same cue (a formatting fix, say) is left out unless it's in your text.
const cueOf = r => r.key.split(":")[0] + ":" + r.cue;

function openEditor(tr, r) {
  const other = Object.keys(edits).find(k => k !== r.key && cueOf(rowsByKey()[k]) === cueOf(r));
  if (other) {  // move an override made on another row of this cue to this row
    edits[r.key] = edits[other];
    delete edits[other];
    const otr = document.querySelector(`tr[data-key="${CSS.escape(other)}"]`);
    if (otr) { const o = rowsByKey()[other]; showFix(otr, o); showActions(otr, o); }
    if (!rowsByKey()[other].has_fix || rowsByKey()[other].bucket === "call") picked.delete(other);
  }
  const lines = edits[r.key] || r.edit_text;
  const ta = document.createElement("textarea");
  ta.rows = Math.max(2, lines.length);
  ta.value = lines.join("\n");
  ta.oninput = () => { edits[r.key] = ta.value.split("\n"); picked.add(r.key); sync(); };
  ta.onkeydown = e => {
    if (e.key === "Escape" || (e.key === "Enter" && (e.ctrlKey || e.metaKey))) { e.preventDefault(); closeEditor(tr, r); }
  };
  const cell = tr.querySelector(".fix");
  cell.innerHTML = "";
  cell.append(ta, Object.assign(document.createElement("div"), {className: "muted",
    textContent: "One subtitle line per row. This replaces the whole cue as written, so keep any other fix you want. Empty deletes the cue."}));
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  tr.querySelector(".actions").innerHTML = `<button class="small done">Done</button>`;
  if (!edits[r.key]) { edits[r.key] = lines.slice(); picked.add(r.key); }
  sync();
}

function closeEditor(tr, r) {
  if (edits[r.key] && edits[r.key].join("\n") === r.edit_text.join("\n") && r.has_fix) {
    delete edits[r.key];  // unchanged: keep the suggestion
  }
  showFix(tr, r);
  showActions(tr, r);
  sync();
}

function revertEdit(tr, r) {
  delete edits[r.key];
  if (r.bucket === "call" || !r.has_fix) picked.delete(r.key);
  showFix(tr, r);
  showActions(tr, r);
  sync();
}

function showFix(tr, r) {
  const cell = tr.querySelector(".fix");
  if (edits[r.key]) {
    const mine = edits[r.key].filter(l => l.trim()).join(" / ");
    cell.innerHTML = `<span class="mine">Your text</span> ` + (mine ? slashes(diff(r.current || "", mine)[1]) : "<i>Delete this cue</i>");
  } else {
    const b = r.suggested && r.suggested !== "Delete this cue" ? diff(r.current || "", r.suggested)[1] : esc(r.suggested || "–");
    cell.innerHTML = slashes(b);
  }
}

function showActions(tr, r) {
  tr.querySelector(".actions").innerHTML = edits[r.key]
    ? `<button class="small edit">Edit</button> <button class="small undo" title="Go back to the suggested fix">Undo</button>`
    : `<button class="small edit">Edit</button>`;
}

function sync() {
  document.querySelectorAll(".icb").forEach(cb => {
    const k = cb.dataset.key;
    if (k in edits) cb.disabled = false;
    cb.checked = picked.has(k);
    cb.closest("tr").classList.toggle("off", !picked.has(k));
  });
  document.querySelectorAll(".gcb").forEach(cb => {
    const keys = [...document.querySelectorAll(`tr[data-in="${cb.dataset.group}"]`)].map(tr => tr.dataset.key);
    const on = keys.filter(k => picked.has(k)).length;
    cb.checked = on === keys.length; cb.indeterminate = on > 0 && on < keys.length;
  });
  const n = picked.size;
  $("#count").textContent = `${n} fix${n === 1 ? "" : "es"} selected` + (Object.keys(edits).length ? ` (${Object.keys(edits).length} edited by you)` : "");
  $("#apply").disabled = !n;
}

$("#none").onclick = () => { picked.clear(); sync(); };
$("#defaults").onclick = () => { render(); };
$("#apply").onclick = async () => {
  const btn = $("#apply");
  btn.disabled = true;
  try {
    const sendEdits = Object.fromEntries(Object.entries(edits).filter(([k]) => picked.has(k)));
    const r = await backend.apply(run, [...picked], sendEdits);
    const zipUrl = r.zip && await backend.downloadUrl(run, r.zip), reportUrl = await backend.downloadUrl(run, "report.md");
    let h = `<section class="panel"><h2>Done</h2>`;
    if (r.timestamp_problem) h += `<p class="err">A timestamp changed in one of the files, so don't use it. Details below.</p>`;
    h += `<p>${r.applied} fix${r.applied === 1 ? "" : "es"} applied to ${r.files.length} file${r.files.length === 1 ? "" : "s"}.` +
      (r.skipped.length ? ` ${r.skipped.length} couldn't be applied (listed below).` : "") + `</p>`;
    if (r.zip) h += `<p><a href="${zipUrl}" download="${esc(r.zip)}"><b>Download corrected files (.zip)</b></a> · <a href="${reportUrl}" download="report.md">report.md</a></p>`;
    h += `<p class="muted">${r.folder ? `Also saved in <code>${esc(r.folder)}</code>. ` : ""}Your original files weren't changed.</p>`;
    if (r.skipped.length) h += `<pre>${esc(r.skipped.join("\n"))}</pre>`;
    h += `<details><summary class="muted">Full log</summary><pre>${esc(r.log)}</pre></details></section>`;
    $("#done").innerHTML = h;
    $("#done").scrollIntoView({behavior: "smooth"});
  } catch (e) { alert(e.message); }
  btn.disabled = false;
};
</script>
</body>
</html>
